<h2 mat-dialog-title class="head-title">Подтверждение</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions class="buttons">
  <button mat-button (click)="cancel()">Отмена</button>
  <button mat-button color="warn" (click)="confirm()">Удалить</button>
</mat-dialog-actions>
