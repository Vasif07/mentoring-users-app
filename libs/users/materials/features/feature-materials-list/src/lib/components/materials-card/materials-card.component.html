<div class="material-card" (dblclick)="onOpen()">
  <div class="material-actions">
    <mat-icon>{{ getIcon(material) }}</mat-icon>
    <button mat-icon-button type="button" color="warn" (click)="onDelete(); $event.stopPropagation()">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
  <div class="material-title">
    {{ material.title }}
  </div>
  <div class="material-date">
    {{ material.created_at | date:'dd.MM.yyyy' }}
  </div>
</div>
