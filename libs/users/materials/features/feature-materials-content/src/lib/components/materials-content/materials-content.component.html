<ng-container>
  <h2 mat-dialog-title>{{ data.material.title }}</h2>

  <mat-dialog-content>
    <ng-container [ngSwitch]="data.type">

      <div *ngSwitchCase="'video'" class="video-container">
        <iframe width="560" height="315"
                [src]="getYoutubeSafeUrl()"
                frameborder="0" allowfullscreen></iframe>
      </div>

      <div *ngSwitchCase="'pdf'" class="pdf-container">
        <iframe [src]="getPdfSafeUrl()" width="100%" height="100%"></iframe>
      </div>

      <div *ngSwitchCase="'audio'" class="audio-container">
        <audio [src]="data.material.material_link" controls></audio>
      </div>

    </ng-container>
  </mat-dialog-content>

  <mat-dialog-actions class="button">
    <button mat-button (click)="closeDialog()" class="close-button">Закрыть</button>
  </mat-dialog-actions>
</ng-container>
